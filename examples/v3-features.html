    n.h=Math.max(24,Math.min(limitY-n.y,o.h+dy));
  } else {
    const b=contentBounds(originals);
    dx=Math.max(-b.left-(auto?CANVAS_LIMIT-p.width:0),Math.min(limitX-b.right,dx));
