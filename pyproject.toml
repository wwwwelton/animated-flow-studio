[project]
name = "animated-flow-studio"
version = "3.0.1"
description = "Offline SVG diagram editor with a dependency-free Python API"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
